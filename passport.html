<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport Seva Registration</title>
</head>
<body>
    <h1>User Registration</h1>
    <label for="registration">Registration to apply at</label><br>
    <input type="radio" name="registration" id="registration" value="">CPV Delhi <br>
    <input type="radio" name="registration" id="registration" value="">Passport Office
   <div><br>
    <label for="Office">Passport Office</label>
   <select name="place" >
   <option value="Benglure">Benglure</option>
   <option value="Goa">Goa</option>
   <option value="Hydrabad">Hydrabad</option>
   <option value="Delhi">Delhi</option>
   <option value="Japan">Japan</option>
     </select>
     </div><br>
     <div>
        <label for="name">Given Name<small>(Max 45 Characters)</small></small></label>
        <input type="text" id="name" value="" placeholder="Enter Given name">
     </div><br>
     <div>
        <label for="sName">Surname<small>(Max 35 Characters)</small></label>
        <input type="text" id="sName" value="" placeholder="Enter Surname">
     </div><br>
     <div>
        <label for="dob">Date os Birth(DD/MM/YYYY)</label>
        <input type="date" id="dob" value="">
</div><br>
<div>
    <label for="email">E-mail Id<small>(Max 35 Characters)</small></label>
  <input type="email" id="email" value="" placeholder="Enter email"> 
</div><br>
<div>
    <label for="do you">Do you want your login <br> Id to be same as E-mail Id?</label>
    <input type="radio" id="do you" name="do you">Yes
    <input type="radio" id="do you" name="do you">No
</div><br>
<div>
    <label for="login Id">Login Id*</label>
    <input type="text" id="login id" placeholder="Enter loginId">
</div><br>
<div>
    <label for="password">Password*</label>
    <input type="password" id="password" value="" placeholder="Enter Password">
</div><br>
<div>
    <label for="hint question">Hint Question*</label>
    <select name="select">
        <option value="Birth place">Birth Place</option>
        <option value="Birth date">Birth date</option>
        <option value="Favourite color">Favourite color</option>
        <option value="First School">First School</option>

    </select>   
</div><br>
<div>
    <lable for="hint answer">Hint Answer</lable>
    <input type="text" id="hint answer" placeholder="Enter Answer">
</div><br>
<div>
    <img src="capth.png" width="150" height="150"><br>
    <label for="charset">Enter Characters Displayed</label>
    <input type="text" id="charset" value="" placeholder="Enter Characters Displayed" >
    
</div><br>
<div>
    <input type="submit">
       <button type="clear">Clear</button> 

</div>
</body>
</html>
